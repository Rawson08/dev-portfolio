<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roshan Subedi — Software Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="bg-layer" aria-hidden="true">
    <div class="mesh mesh-a"></div>
    <div class="mesh mesh-b"></div>
    <div class="mesh mesh-c"></div>
    <div class="grid-overlay"></div>
    <div class="noise"></div>
  </div>

  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweak defaults block (editable by host) -->
  <script>
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "light",
      "heroVariant": "classic",
      "accentHue": 105
    }/*EDITMODE-END*/;
  </script>

  <script type="text/babel" src="assets/primitives.jsx"></script>
  <script type="text/babel" src="assets/cinematic.jsx"></script>
  <script type="text/babel" src="assets/code-truck.jsx"></script>
  <script type="text/babel" src="assets/hero.jsx"></script>
  <script type="text/babel" src="assets/projects.jsx"></script>
  <script type="text/babel" src="assets/sections.jsx"></script>
  <script type="text/babel" src="assets/app.jsx"></script>

  <!-- Safety net: force-reveal any .reveal elements still hidden after 1.5s -->
  <script>
    setTimeout(() => {
      document.querySelectorAll('.reveal:not(.in)').forEach(el => {
        if (el.getAnimations) el.getAnimations().forEach(a => a.cancel());
        el.style.animationDelay = '0ms';
        el.classList.add('in');
      });
    }, 1500);
  </script>
</body>
</html>
